name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.2.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test

      # Trusted publishing (OIDC): requires the package to exist and the
      # GitHub Actions publisher to be configured on npmjs.com.
      - run: npm publish --access public
